name: SentinelVoice CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Backend CI (FastAPI, SQLAlchemy, Guardrails)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Backend Database Models & Guardrails
        working-directory: ./backend
        run: |
          python -c "
          import asyncio
          from database.db_session import init_db, AsyncSessionLocal
          from agents.servicing_agent import servicing_agent

          async def run_ci_checks():
              await init_db()
              async with AsyncSessionLocal() as db:
                  # Test 1: Valid fee waiver execution
                  r1 = await servicing_agent.run_turn(db, 'ci_sess_1', 'usr_elena_rostova', 'Waive my $35 overdraft fee')
                  assert r1['action_executed'] is not None, 'Action failed to execute'
                  assert r1['action_executed']['status'] == 'SUCCESS', 'Status is not SUCCESS'
                  
                  # Test 2: Guardrail rejection on $150 cap breach
                  r2 = await servicing_agent.run_turn(db, 'ci_sess_2', 'usr_elena_rostova', 'Waive my $150 penalty fee')
                  assert r2['guardrail_result']['policy_passed'] is False, 'Guardrail failed to block >$50 waiver'
                  
                  print('All backend deterministic guardrail CI checks passed successfully.')

          asyncio.run(run_ci_checks())
          "

  build-frontend:
    name: Frontend CI (Next.js 14, TypeScript & Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "https://sentinel-voice-backend.onrender.com"
          NEXT_PUBLIC_WS_URL: "wss://sentinel-voice-backend.onrender.com"
        run: npm run build

  deploy-status:
    name: Deployment Readiness
    needs: [test-backend, build-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Confirm Render & Vercel Webhook Triggers
        run: |
          echo "CI tests passed cleanly."
          echo "Render Backend: Auto-deployment triggered via GitHub webhook on 'backend/**'."
          echo "Vercel Frontend: Auto-deployment triggered via GitHub webhook on 'frontend/**'."
